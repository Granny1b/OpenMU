# CI for the public website (/website). Lives at the repository root because GitHub Actions only
# discovers workflows in the root .github/workflows - a copy under website/.github/workflows would
# be silently inert, taking both safety nets with it.
name: Website

on:
  push:
    branches: [ master, main ]
    paths: [ 'website/**', 'deploy/**', '.github/workflows/website.yml' ]
  pull_request:
    paths: [ 'website/**', 'deploy/**', '.github/workflows/website.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          # The databases this workflow uses are created explicitly below, with production names.
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [ '5432:5432' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The website must never reference OpenMU source: that reference is what would turn a
      # `docker compose pull` upgrade into a fork merge.
      # Parsed as XML, not grepped: ElementTree skips comments, and the csproj carries a comment
      # explaining that there is deliberately no ProjectReference - which a plain grep matches,
      # failing the build on the very text that documents the rule.
      - name: No ProjectReference into the server tree
        run: |
          python3 - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          refs = [e.get('Include') for e in ET.parse('src/MuSite/MuSite.csproj').getroot().iter('ProjectReference')]
          if refs:
              print(f"::error::src/MuSite/MuSite.csproj must not reference any project. Found: {refs}")
              sys.exit(1)
          print('ok: the website references no project in the OpenMU solution')
          EOF

      # The two package files must agree on BCrypt, or a password hashed by the site may not verify
      # in the game - an account that is created and can never log in, with no error anywhere.
      - name: BCrypt version matches the server
        run: |
          site=$(grep -oP 'BCrypt\.Net-Next" Version="\K[^"]+' Directory.Packages.props)
          game=$(grep -oP 'BCrypt\.Net-Next" Version="\K[^"]+' ../src/Directory.Packages.props)
          echo "website=$site server=$game"
          if [ "$site" != "$game" ]; then
            echo "::error::BCrypt.Net-Next is $site here and $game in src/Directory.Packages.props."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The databases are named exactly as they are in production - openmu and openmu_web - because
      # db/01-roles.sql names them: it grants CONNECT ON DATABASE openmu and creates openmu_web.
      # Running these files against differently named databases tests something that will never be
      # deployed, and CI found that out the hard way.
      - name: Prepare the stand-in game database
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE openmu"
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 -f tests/MuSite.Tests/StandInSchema.sql
          # Also exercises the DO block that decides whether ux_account_loginname_lower can be created.
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 -f db/02-indexes.sql

      # Turns the column-level grants into a permanent regression gate: without this, a later edit
      # could widen mu_web_read to the whole Account row and nothing would notice.
      - name: Grants deny what they must deny
        env:
          PGPASSWORD: ci
        run: |
          # 01-roles.sql also creates the openmu_web database, so it must run before the site
          # schema step below.
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 \
               -v read_pw=ci -v auth_pw=ci -v reg_pw=ci -v app_pw=ci -v own_pw=ci -v log_pw=ci \
               -f db/01-roles.sql
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 -f db/01b-grants.sql

          deny() {
            if PGPASSWORD=ci psql -h localhost -U "$1" -d openmu -tAc "$2" >/dev/null 2>&1; then
              echo "::error::$1 was ALLOWED to run: $2"
              exit 1
            fi
            echo "denied as expected: $1 -- $2"
          }
          allow() {
            if ! PGPASSWORD=ci psql -h localhost -U "$1" -d openmu -tAc "$2" >/dev/null 2>&1; then
              echo "::error::$1 was DENIED but must be allowed: $2"
              exit 1
            fi
            echo "allowed as expected: $1 -- $2"
          }

          deny  mu_web_read 'SELECT * FROM data."Account" LIMIT 1'
          deny  mu_web_read 'SELECT "PasswordHash" FROM data."Account" LIMIT 1'
          deny  mu_web_read 'SELECT "EMail" FROM data."Account" LIMIT 1'
          deny  mu_web_read 'SELECT "LoginName" FROM data."Account" LIMIT 1'
          deny  mu_web_reg  'SELECT "PasswordHash" FROM data."Account" LIMIT 1'
          deny  mu_web_read 'DELETE FROM data."Character"'
          deny  mu_web_auth 'DELETE FROM data."Account"'
          deny  mu_web_reg  'DELETE FROM data."Account"'
          deny  mu_web_auth 'UPDATE data."Account" SET "State" = 4'
          allow mu_web_read 'SELECT count(*) FROM data."Character"'
          allow mu_web_auth 'SELECT count("PasswordHash") FROM data."Account"'
          allow mu_web_reg  'SELECT count("EMail") FROM data."Account"'

          # The /item builder's option chain: readable, and read-only. A grant that is missing here
          # takes out the builder at request time, in production, with a 500.
          allow mu_web_read 'SELECT count(*) FROM config."ItemDefinitionItemOptionDefinition"'
          allow mu_web_read 'SELECT count(*) FROM config."IncreasableItemOption"'
          allow mu_web_read 'SELECT count(*) FROM config."ItemOptionOfLevel"'
          allow mu_web_read 'SELECT count(*) FROM config."PowerUpDefinitionValue"'
          allow mu_web_read 'SELECT count(*) FROM config."AttributeRelationship"'
          allow mu_web_read 'SELECT count(*) FROM config."ItemOfItemSet"'
          allow mu_web_read 'SELECT count(*) FROM config."ItemSetGroup"'
          allow mu_web_read 'SELECT "Number" FROM config."Skill" LIMIT 1'
          deny  mu_web_read $'UPDATE config."ItemDefinition" SET "Name" = \'x\''
          deny  mu_web_read 'DELETE FROM config."ItemOfItemSet"'
          deny  mu_web_read 'SELECT "ExpMultiplier" FROM config."GameMapDefinition" LIMIT 1'

      # Applied as mu_web_own, which owns openmu_web - the same role the mu-site-migrate container
      # uses. Twice, because every migration file has to be re-runnable.
      - name: Site schema applies cleanly and is idempotent
        env:
          PGPASSWORD: ci
        run: |
          for pass in 1 2; do
            for file in db/web/*.sql; do
              psql -h localhost -U mu_web_own -d openmu_web -v ON_ERROR_STOP=1 -f "$file"
            done
          done

          # The log shipper appends and does nothing else. A shipper that could SELECT could
          # exfiltrate everything the server ever logged; one that could DELETE could cover its
          # tracks. And audit_log must KEEP its no-DELETE guarantee even though server_log has one.
          deny() {
            if PGPASSWORD=ci psql -h localhost -U "$1" -d openmu_web -tAc "$2" >/dev/null 2>&1; then
              echo "::error::$1 was ALLOWED to run: $2"; exit 1
            fi
            echo "denied as expected: $1 -- $2"
          }
          allow() {
            if ! PGPASSWORD=ci psql -h localhost -U "$1" -d openmu_web -tAc "$2" >/dev/null 2>&1; then
              echo "::error::$1 was DENIED but must be allowed: $2"; exit 1
            fi
            echo "allowed as expected: $1 -- $2"
          }

          allow mu_web_log "INSERT INTO server_log (id,at,level,message) VALUES (gen_random_uuid(), now(), 'Information', 'ci')"
          deny  mu_web_log 'SELECT count(*) FROM server_log'
          deny  mu_web_log 'DELETE FROM server_log'
          deny  mu_web_log "UPDATE server_log SET message = 'tampered'"
          deny  mu_web_log 'SELECT * FROM audit_log'
          deny  mu_web_log 'SELECT * FROM web_session'
          allow mu_web_app 'SELECT count(*) FROM server_log'
          allow mu_web_app "DELETE FROM server_log WHERE at < now() - interval '99 years'"
          deny  mu_web_app 'DELETE FROM audit_log'
          deny  mu_web_app "INSERT INTO server_log (id,at,level,message) VALUES (gen_random_uuid(), now(), 'x', 'y')"

          # The metric tables draw the same boundary. The shipper appends measurements and can do
          # nothing else: one that could READ them could work out when the server is empty, which is
          # exactly when a break-in goes unnoticed, and one that could DELETE could erase the spike
          # it caused. The site reads and prunes, and cannot forge a measurement.
          allow mu_web_log "INSERT INTO host_metric (at,name,scope,value) VALUES (now(), 'load1', '', 1)"
          deny  mu_web_log 'SELECT count(*) FROM host_metric'
          deny  mu_web_log 'DELETE FROM host_metric'
          deny  mu_web_log "UPDATE host_metric SET value = 0"
          deny  mu_web_log 'SELECT count(*) FROM server_sample'
          deny  mu_web_log "INSERT INTO server_sample (at,is_up) VALUES (now(), true)"
          allow mu_web_app 'SELECT count(*) FROM host_metric'
          allow mu_web_app "DELETE FROM host_metric WHERE at < now() - interval '99 years'"
          deny  mu_web_app "INSERT INTO host_metric (at,name,scope,value) VALUES (now(), 'x', '', 1)"
          allow mu_web_app "INSERT INTO server_sample (at,is_up,players) VALUES (now(), true, 1)"
          allow mu_web_app "DELETE FROM server_sample WHERE at < now() - interval '99 years'"

      - name: Test
        env:
          MUSITE_TEST_DB: "Host=localhost;Port=5432;Username=postgres;Password=ci;Database=openmu"
          # SiteQueriesTests covers openmu_web. Without this the suite silently SKIPS, which is how
          # NewsItem, AuditEntry and BanRecord all shipped unable to materialise.
          MUSITE_TEST_SITE_DB: "Host=localhost;Port=5432;Username=postgres;Password=ci;Database=openmu_web"
        run: dotnet test --no-build -c Release --verbosity normal

      # Dapper matches a record's constructor to the reader's columns by name, by ORDER and by TYPE,
      # and rejects it at the first row when any of the three is off - never at compile time, and
      # never on an empty result. CharacterProfile, NewsItem and ItemRow each shipped broken that
      # way. This asks PostgreSQL what every GameCatalog query actually returns and compares it to
      # the record; the tests above would only catch it where a fixture happens to have rows.
      - name: Every query maps to its record
        env:
          MUSITE_TEST_DB: "Host=localhost;Port=5432;Username=postgres;Password=ci;Database=openmu"
          # ServerLog's queries run against the SITE database, so the tool needs both. An unset
          # variable is a failure there, not a silent skip - a check that quietly covers half the
          # queries is the blind spot this tool exists to close.
          MUSITE_TEST_SITE_DB: "Host=localhost;Port=5432;Username=postgres;Password=ci;Database=openmu_web"
          PGPASSWORD: ci
        run: python3 tools/verify-query-mapping.py

      # A duplicate mapping key is valid to PyYAML - it silently keeps the last one - and REJECTED
      # by the Go parser Docker Compose uses. That difference shipped a compose file the server
      # could not parse while this workflow went green, so the gate has to be compose itself.
      # --env-file /dev/null because the real .env holds secrets and is not in the repository;
      # unset variables are only warnings, and `config` still parses and resolves the whole file.
      - name: Every compose file parses
        working-directory: .
        run: |
          for dir in deploy/*/; do
            [ -f "$dir/docker-compose.yml" ] || continue
            echo "--- $dir"
            ( cd "$dir" && docker compose --env-file /dev/null config --quiet )
          done

      # The shipper's regex fails SILENTLY: a pattern that does not match does not error, it files
      # everything under level "Unparsed", and a missing log line looks exactly like nothing having
      # happened. Vector cannot run here, so this checks the pattern - read out of vector.yaml, not
      # copied - against real Serilog output.
      - name: The log shipper parses OpenMU's real log format
        run: python3 tools/verify-log-parse.py

      # 001_init.sql claims audit_log is append-only because mu_web_app does not own it. That claim
      # is a comment until something checks it. The INSERT is asserted too: without it, a table the
      # role cannot reach at all would report every destructive statement as correctly denied.
      - name: Audit log is append-only
        env:
          PGPASSWORD: ci
        run: |
          app() { psql -h localhost -U mu_web_app -d openmu_web -tAc "$1" >/dev/null 2>&1; }

          app "INSERT INTO audit_log (actor, action, target_name, detail) VALUES ('ci','ci.boundary','ci','')" \
            || { echo "::error::mu_web_app cannot INSERT into audit_log - the rest of this step proves nothing"; exit 1; }
          app "SELECT count(*) FROM audit_log" \
            || { echo "::error::mu_web_app cannot SELECT from audit_log"; exit 1; }
          echo "INSERT and SELECT allowed as expected"

          for statement in "DELETE FROM audit_log" "UPDATE audit_log SET actor = 'x'" "TRUNCATE audit_log"; do
            if app "$statement"; then
              echo "::error::mu_web_app was ALLOWED to run: $statement"
              exit 1
            fi
            echo "denied as expected: $statement"
          done

      - name: Docker image builds
        run: docker build -t mu-site:ci .
