# CI for the public website (/website). Lives at the repository root because GitHub Actions only
# discovers workflows in the root .github/workflows - a copy under website/.github/workflows would
# be silently inert, taking both safety nets with it.
name: Website

on:
  push:
    branches: [ master, main ]
    paths: [ 'website/**', '.github/workflows/website.yml' ]
  pull_request:
    paths: [ 'website/**', '.github/workflows/website.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          # The databases this workflow uses are created explicitly below, with production names.
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [ '5432:5432' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The website must never reference OpenMU source: that reference is what would turn a
      # `docker compose pull` upgrade into a fork merge.
      # Parsed as XML, not grepped: ElementTree skips comments, and the csproj carries a comment
      # explaining that there is deliberately no ProjectReference - which a plain grep matches,
      # failing the build on the very text that documents the rule.
      - name: No ProjectReference into the server tree
        run: |
          python3 - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          refs = [e.get('Include') for e in ET.parse('src/MuSite/MuSite.csproj').getroot().iter('ProjectReference')]
          if refs:
              print(f"::error::src/MuSite/MuSite.csproj must not reference any project. Found: {refs}")
              sys.exit(1)
          print('ok: the website references no project in the OpenMU solution')
          EOF

      # The two package files must agree on BCrypt, or a password hashed by the site may not verify
      # in the game - an account that is created and can never log in, with no error anywhere.
      - name: BCrypt version matches the server
        run: |
          site=$(grep -oP 'BCrypt\.Net-Next" Version="\K[^"]+' Directory.Packages.props)
          game=$(grep -oP 'BCrypt\.Net-Next" Version="\K[^"]+' ../src/Directory.Packages.props)
          echo "website=$site server=$game"
          if [ "$site" != "$game" ]; then
            echo "::error::BCrypt.Net-Next is $site here and $game in src/Directory.Packages.props."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The databases are named exactly as they are in production - openmu and openmu_web - because
      # db/01-roles.sql names them: it grants CONNECT ON DATABASE openmu and creates openmu_web.
      # Running these files against differently named databases tests something that will never be
      # deployed, and CI found that out the hard way.
      - name: Prepare the stand-in game database
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE openmu"
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 -f tests/MuSite.Tests/StandInSchema.sql
          # Also exercises the DO block that decides whether ux_account_loginname_lower can be created.
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 -f db/02-indexes.sql

      # Turns the column-level grants into a permanent regression gate: without this, a later edit
      # could widen mu_web_read to the whole Account row and nothing would notice.
      - name: Grants deny what they must deny
        env:
          PGPASSWORD: ci
        run: |
          # 01-roles.sql also creates the openmu_web database, so it must run before the site
          # schema step below.
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 \
               -v read_pw=ci -v auth_pw=ci -v reg_pw=ci -v app_pw=ci -v own_pw=ci \
               -f db/01-roles.sql
          psql -h localhost -U postgres -d openmu -v ON_ERROR_STOP=1 -f db/01b-grants.sql

          deny() {
            if PGPASSWORD=ci psql -h localhost -U "$1" -d openmu -tAc "$2" >/dev/null 2>&1; then
              echo "::error::$1 was ALLOWED to run: $2"
              exit 1
            fi
            echo "denied as expected: $1 -- $2"
          }
          allow() {
            if ! PGPASSWORD=ci psql -h localhost -U "$1" -d openmu -tAc "$2" >/dev/null 2>&1; then
              echo "::error::$1 was DENIED but must be allowed: $2"
              exit 1
            fi
            echo "allowed as expected: $1 -- $2"
          }

          deny  mu_web_read 'SELECT * FROM data."Account" LIMIT 1'
          deny  mu_web_read 'SELECT "PasswordHash" FROM data."Account" LIMIT 1'
          deny  mu_web_read 'SELECT "EMail" FROM data."Account" LIMIT 1'
          deny  mu_web_read 'SELECT "LoginName" FROM data."Account" LIMIT 1'
          deny  mu_web_reg  'SELECT "PasswordHash" FROM data."Account" LIMIT 1'
          deny  mu_web_read 'DELETE FROM data."Character"'
          deny  mu_web_auth 'DELETE FROM data."Account"'
          deny  mu_web_reg  'DELETE FROM data."Account"'
          deny  mu_web_auth 'UPDATE data."Account" SET "State" = 4'
          allow mu_web_read 'SELECT count(*) FROM data."Character"'
          allow mu_web_auth 'SELECT count("PasswordHash") FROM data."Account"'
          allow mu_web_reg  'SELECT count("EMail") FROM data."Account"'

      # Applied as mu_web_own, which owns openmu_web - the same role the mu-site-migrate container
      # uses. Twice, because every migration file has to be re-runnable.
      - name: Site schema applies cleanly and is idempotent
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U mu_web_own -d openmu_web -v ON_ERROR_STOP=1 -f db/web/001_init.sql
          psql -h localhost -U mu_web_own -d openmu_web -v ON_ERROR_STOP=1 -f db/web/001_init.sql

      - name: Test
        env:
          MUSITE_TEST_DB: "Host=localhost;Port=5432;Username=postgres;Password=ci;Database=openmu"
          # SiteQueriesTests covers openmu_web. Without this the suite silently SKIPS, which is how
          # NewsItem, AuditEntry and BanRecord all shipped unable to materialise.
          MUSITE_TEST_SITE_DB: "Host=localhost;Port=5432;Username=postgres;Password=ci;Database=openmu_web"
        run: dotnet test --no-build -c Release --verbosity normal

      # 001_init.sql claims audit_log is append-only because mu_web_app does not own it. That claim
      # is a comment until something checks it. The INSERT is asserted too: without it, a table the
      # role cannot reach at all would report every destructive statement as correctly denied.
      - name: Audit log is append-only
        env:
          PGPASSWORD: ci
        run: |
          app() { psql -h localhost -U mu_web_app -d openmu_web -tAc "$1" >/dev/null 2>&1; }

          app "INSERT INTO audit_log (actor, action, target_name, detail) VALUES ('ci','ci.boundary','ci','')" \
            || { echo "::error::mu_web_app cannot INSERT into audit_log - the rest of this step proves nothing"; exit 1; }
          app "SELECT count(*) FROM audit_log" \
            || { echo "::error::mu_web_app cannot SELECT from audit_log"; exit 1; }
          echo "INSERT and SELECT allowed as expected"

          for statement in "DELETE FROM audit_log" "UPDATE audit_log SET actor = 'x'" "TRUNCATE audit_log"; do
            if app "$statement"; then
              echo "::error::mu_web_app was ALLOWED to run: $statement"
              exit 1
            fi
            echo "denied as expected: $statement"
          done

      - name: Docker image builds
        run: docker build -t mu-site:ci .
