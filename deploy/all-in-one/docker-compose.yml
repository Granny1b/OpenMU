services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openmu-startup
      - mu-site

  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    ports:
      # No "8080" entry. A bare port with no host mapping does not mean "unpublished" - Docker binds
      # it to a RANDOM host port on 0.0.0.0, so the admin panel was reachable from the internet on a
      # port that changed every restart, over plain HTTP. Nothing needs it published: nginx reaches
      # the panel as openmu-startup:8080 over the compose network and serves it on the "admin."
      # hostname. This is the same reason the database service publishes nothing.
      #
      # For local development docker-compose.override.yml maps 8081:8080. On a server with no domain
      # yet, docker-compose.panel-loopback.yml publishes nginx's 8081 on the host loopback for an
      # SSH tunnel.
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "44406:44406"
      - "55980:55980"
    environment:
      DB_HOST: database
      ASPNETCORE_URLS: http://+:8080
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:-}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys
      # Serilog writes logs/log.txt relative to WORKDIR /app, so the server's log lives at
      # /app/logs. Without this volume it lives only inside the container and EVERY
      # `docker compose up -d --build` throws away the whole history - which is exactly when you
      # most want to read what happened before. 48 files x 4 MB, so ~190 MB at the ceiling.
      - openmu-logs:/app/logs
    working_dir: /app/
    depends_on:
      - database

  # The public website. No published host port - nginx reaches it by container name.
  mu-site:
    image: mu-site
    container_name: mu-site
    build:
      context: ../../website
      dockerfile: Dockerfile
    environment:
      # Six separate roles across the deployment, so no single code path can read every password
      # hash. The site itself uses four of them; mu_web_own migrates and mu_web_log only appends logs.
      # See website/db/01b-grants.sql and website/.env.example.
      ConnectionStrings__GameRead: "Host=database;Database=openmu;Username=mu_web_read;Password=${MUSITE_DB_READ_PW:-}"
      ConnectionStrings__GameAuth: "Host=database;Database=openmu;Username=mu_web_auth;Password=${MUSITE_DB_AUTH_PW:-}"
      ConnectionStrings__GameReg:  "Host=database;Database=openmu;Username=mu_web_reg;Password=${MUSITE_DB_REG_PW:-}"
      ConnectionStrings__Site:     "Host=database;Database=openmu_web;Username=mu_web_app;Password=${MUSITE_DB_APP_PW:-}"
      MUSITE_SERVERNAME: ${MUSITE_SERVERNAME:-OpenMU Server}
      # BOTH conditions gate /admin: the account's State must be GameMaster, AND its login name must
      # appear here. Empty means zero admins and /admin returns 404 - that is deliberate.
      MUSITE_ADMINS__0: ${MUSITE_ADMIN_1:-}
      MUSITE_ADMINS__1: ${MUSITE_ADMIN_2:-}
      MUSITE_OWNER: ${MUSITE_OWNER:-}
      # 20 for Season 6, 10 for 0.75/0.95d. Lowering it later strands every account registered in
      # between: a longer password is truncated by the client, so its hash can never verify again.
      MUSITE_MAXPASSWORD: ${MUSITE_MAXPASSWORD:-20}
      MUSITE_CONNECTHOST: ${MUSITE_CONNECTHOST:-}
      MUSITE_CLIENTURL: ${MUSITE_CLIENTURL:-}
      MUSITE_DISCORDURL: ${MUSITE_DISCORDURL:-}
      # The connect server is reached by container name; the published host ports differ per deploy
      # variant, and probing those would report "offline" on the wrong one.
      MUSITE_PROBEENDPOINTS__0: "openmu-startup:44405"
      # The docker bridge network, so X-Forwarded-For from nginx is honoured.
      MUSITE_TRUSTEDNETWORKS__0: ${MUSITE_TRUSTEDNETWORKS:-172.16.0.0/12}
    volumes:
      - site-keys:/app/keys
    depends_on:
      - database

  # One-shot: creates the openmu_web schema. The ONLY place mu_web_own credentials appear - the
  # running site connects as mu_web_app, which does not own that database, and that non-ownership
  # is what makes audit_log genuinely append-only.
  #   docker compose run --rm mu-site-migrate
  mu-site-migrate:
    image: mu-site-migrate
    # No container_name: this service only ever runs via `docker compose run --rm`, and a fixed name
    # is one a crashed run can leave behind to block the next one. Compose names one-off containers
    # itself.
    build:
      context: ../../website
      dockerfile: Dockerfile.migrate
    profiles: ["tools"]
    environment:
      MUSITE_MIGRATE_CONNSTR: "postgresql://mu_web_own:${MUSITE_DB_OWN_PW:-}@database:5432/openmu_web"
    depends_on:
      - database

  # Ships the server log into openmu_web.server_log so it can be searched.
  #
  # It reads the log VOLUME, not the Docker socket: Vector's docker_logs source needs
  # /var/run/docker.sock, and read access to that socket is effectively root on the host, because a
  # container that can talk to it can start another with the host filesystem mounted. A read-only
  # bind of the log volume needs no privilege at all.
  #
  # 0.46.0 is the minimum: the native postgres sink landed in that release. A newer tag is fine.
  vector:
    image: timberio/vector:0.46.0-debian
    container_name: mu-log-shipper
    restart: unless-stopped
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - openmu-logs:/openmu-logs:ro
      - vector-data:/vector-data
    environment:
      # mu_web_log can only INSERT into server_log - see website/db/web/002_server_log.sql. It
      # cannot read a line back, so this credential leaking does not expose the log.
      MUSITE_LOG_DSN: "postgresql://mu_web_log:${MUSITE_DB_LOG_PW:-}@database:5432/openmu_web"
    depends_on:
      - database
      - openmu-startup

  database:
    image: postgres
    container_name: database
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    # Deliberately NOT published. `ports: - "5432"` binds a random host port on 0.0.0.0, which
    # exposed PostgreSQL - with POSTGRES_PASSWORD: admin - to anything that could reach the machine.
    # Every container that needs it reaches it by name on the compose network.
    # docker-compose.override.yml still publishes 5433 for local development; that override is not
    # used by the production command.
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume

volumes:
  adminpanel-keys:
  dbdata:
  # The website's data protection key ring - it signs the auth cookie, so anything able to read it
  # can forge a session for any account. The image creates the directory as 0700.
  site-keys:
  site-keys:
  # OpenMU's rolling log files, so history survives a rebuild and the shipper has something to read.
  openmu-logs:
  # Vector's read checkpoints. Without it, a restart re-reads from the end and loses whatever
  # arrived while it was down; with it, it resumes where it stopped.
  vector-data:
