# Ships OpenMU's server log into the website's own database, so /admin/logs can search it.
#
# WHY IT READS FILES RATHER THAN THE DOCKER SOCKET
#
# Vector's docker_logs source needs /var/run/docker.sock mounted, and read access to that socket is
# effectively root on the host - a container that can talk to it can start another container with
# the host filesystem mounted. Reading the log volume read-only needs no such privilege, and the
# openmu-logs volume exists anyway so that history survives a rebuild.
#
# WHY THE IMAGE IS NOT INVOLVED
#
# The munique/openmu image carries only Serilog's Console and File sinks - Serilog.Sinks.Grafana.Loki
# is referenced by src/Dapr/Common, which builds the *distributed* image, not this one. So nothing
# here changes OpenMU: it keeps writing the same files it always did, and `docker compose pull`
# still upgrades the server cleanly.

data_dir: /vector-data

sources:
  openmu_log:
    type: file
    include:
      - /openmu-logs/log*.txt
    # Read from the end on a first run. Without this, turning Vector on would replay up to 48 files
    # of history - roughly 190 MB - into the database in one go.
    ignore_older_secs: 86400
    read_from: end

    # A stack trace is several lines belonging to ONE event. Serilog writes the exception after the
    # message with no timestamp of its own, so lines accumulate until the next line that starts with
    # a timestamp. Without this every "   at Foo.Bar()" frame would arrive as its own log entry and
    # the exception would be unreadable.
    multiline:
      mode: halt_before
      start_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} [+-]\d{2}:\d{2} \['
      condition_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} [+-]\d{2}:\d{2} \['
      timeout_ms: 1000

  # ---- the VPS itself --------------------------------------------------------------------------
  # "Is the box overworked?" needs numbers the game server never produces, so they are read from the
  # kernel instead. Two things make this cheap and safe:
  #
  #   * /proc inside a container is the HOST's /proc, so cpu, memory and load are the real machine's
  #     without mounting anything. Verified: memory_total_bytes came back as the host's MemTotal.
  #   * A Docker volume lives on the host filesystem, so statvfs on /openmu-logs reports the HOST
  #     disk. That is the number that matters - the one that fills up - and it costs no extra mount.
  #
  # Uncurated this source emits 151 rows per scrape, most of it loop devices and per-process
  # samples. The collectors, the filters below and the vps_wanted transform cut that to about 24.
  vps:
    type: host_metrics
    scrape_interval_secs: 30
    # No `process` (one row per process - 2313 of them in a 12 second local run) and no `cgroups`
    # (per-container figures we deliberately did not ask for; it would also need /sys/fs/cgroup).
    collectors: [cpu, disk, filesystem, load, memory, network, host]
    disk:
      devices:
        excludes: ["loop*", "zram*", "ram*", "dm-*", "sr*"]
    filesystem:
      # Real filesystems only. Without this, every tmpfs, cgroup and proc mount reports a series,
      # and the ones with a zero size divide by zero into a null ratio.
      filesystems:
        includes: ["ext2", "ext3", "ext4", "xfs", "btrfs", "zfs"]
    network:
      # Loopback is not traffic, and veth/br-/docker interfaces are one per container - they would
      # swamp the graph with the stack talking to itself.
      devices:
        excludes: ["lo", "veth*", "br-*", "docker*", "ifb*"]

transforms:
  parsed:
    type: remap
    inputs: [openmu_log]
    # A line that fails to parse is KEPT, not dropped: a log system that silently discards what it
    # does not understand is worse than none, because the absence looks like silence.
    source: |
      raw = string!(.message)

      # The first line is the event; anything after it is the exception.
      halves = split(raw, "\n", limit: 2)
      head = halves[0]
      trace = if length(halves) > 1 { strip_whitespace(string!(halves[1])) } else { "" }

      # Three bracket groups from the LEFT, then the rest is the message. Anchored and
      # non-greedy on purpose: real messages contain brackets, e.g.
      #   Item 'Jewel of Bless' got picked up by player '[GM] Granny' [slot 3]
      # so matching brackets loosely would eat the message. SourceContext is a type name and
      # EventId renders as "{ Id = 42, Name = X }" - neither can contain "]".
      fields, err = parse_regex(head, r'^(?P<at>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} [+-]\d{2}:\d{2}) \[(?P<level>\w+)\] \[(?P<source>[^\]]*)\] \[(?P<event_id>[^\]]*)\] (?P<message>.*)$')

      if err == null {
        .at = parse_timestamp!(fields.at, "%Y-%m-%d %H:%M:%S%.3f %:z")
        .level = fields.level
        .source = if fields.source == "" { null } else { fields.source }
        .event_id = if fields.event_id == "" { null } else { fields.event_id }
        .message = fields.message
      } else {
        .at = now()
        .level = "Unparsed"
        .source = null
        .event_id = null
        .message = raw
      }

      .exception = if trace == "" { null } else { trace }

      # uuid_v4 rather than a bigserial default: the postgres sink builds the row from the event's
      # own fields, so a column the event does not carry would be sent as NULL and break a serial
      # primary key. A unique id also gives /admin/logs a total order to page by - ordering on the
      # timestamp alone repeats and skips rows when two events share a millisecond.
      .id = uuid_v4()

      # Everything Vector adds of its own (file, host, source_type, timestamp) is dropped: the
      # table has no columns for them and they would just be serialised and discarded.
      . = {"id": .id, "at": .at, "level": .level, "source": .source,
           "event_id": .event_id, "message": .message, "exception": .exception}

  # Debug and Verbose are off in OpenMU's default configuration, but raising the level to chase a
  # bug should not silently start writing 243 extra call sites into the database. Anything below
  # Information is dropped here, so the level can be raised in the game server without a surprise.
  wanted:
    type: filter
    inputs: [parsed]
    condition: '!includes(["Debug", "Verbose"], .level)'

  # ---- the VPS series --------------------------------------------------------------------------
  # host_metrics emits metric events; the postgres sink writes an event's fields as columns. Left
  # alone, a metric serialises with its value nested under `gauge`/`counter`, which would need a
  # jsonb column and `(gauge->>'value')::float` in every query. metric_to_log makes the shape
  # editable, and the remap below flattens it to the four columns the table actually has.
  vps_log:
    type: metric_to_log
    inputs: [vps]

  vps_wanted:
    type: filter
    inputs: [vps_log]
    condition:
      type: vrl
      source: |
        name = to_string(.name) ?? ""
        if name == "cpu_seconds_total" {
          # Only the idle counter. CPU busy% is derived from it in SQL (100 - idle delta over
          # elapsed time over core count); keeping all eight modes per core would be eight times
          # the rows and tell us nothing more.
          (to_string(.tags.mode) ?? "") == "idle"
        } else {
          includes([
            "memory_total_bytes", "memory_used_bytes", "memory_available_bytes",
            "memory_swap_total_bytes", "memory_swap_used_bytes",
            "load1", "load5", "load15", "logical_cpus", "uptime",
            "filesystem_total_bytes", "filesystem_used_bytes", "filesystem_free_bytes",
            "network_receive_bytes_total", "network_transmit_bytes_total",
            "disk_read_bytes_total", "disk_written_bytes_total"
          ], name)
        }

  vps_rows:
    type: remap
    inputs: [vps_wanted]
    source: |
      .at = .timestamp

      # A metric is a gauge or a counter, never both, and the sink cannot see through the nesting.
      v = .gauge.value
      if v == null { v = .counter.value }
      .value = to_float(v) ?? null

      # One tag separates the series of a metric, and which tag it is depends on the metric: the
      # core number for cpu, the interface for network, the block device for disk and filesystem.
      # Filesystems are keyed by DEVICE rather than mountpoint on purpose - the same disk is mounted
      # into this container more than once (the log volume and vector's own data dir), and keying by
      # mountpoint would draw the same disk as two identical lines.
      s = .tags.cpu
      if s == null { s = .tags.device }
      if s == null { s = .tags.mountpoint }
      .scope = to_string(s) ?? ""

      . = {"at": .at, "name": .name, "scope": .scope, "value": .value}

  # A metric whose value did not survive to_float would insert NULL into a NOT NULL column and fail
  # the whole batch, taking the good rows with it. Vector's filesystem collector emits exactly that
  # for a zero-sized pseudo-mount.
  vps_ok:
    type: filter
    inputs: [vps_rows]
    condition: '.value != null'

sinks:
  web_db:
    type: postgres
    inputs: [wanted]
    endpoint: ${MUSITE_LOG_DSN}
    table: server_log
    batch:
      max_events: 200
      timeout_secs: 5
    # Keep trying rather than dropping: a database restart must not lose the log lines that explain
    # why it restarted.
    request:
      retry_attempts: 10

  # Same credential and same append-only role as the log shipper: it can add measurements and
  # neither read nor remove them. Retention is the site's job, as it is for server_log.
  metrics_db:
    type: postgres
    inputs: [vps_ok]
    endpoint: ${MUSITE_LOG_DSN}
    table: host_metric
    batch:
      max_events: 200
      timeout_secs: 10
    request:
      retry_attempts: 10
