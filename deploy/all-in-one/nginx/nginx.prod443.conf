events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        include conf.d/nginx.server_name.conf;
        include conf.d/nginx.prod.certificates.conf;


        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # proxy_set_header does NOT merge across levels: a block that defines any of these inherits none
        # of the outer ones, so all six live together here.
        #
        # Without X-Forwarded-For the application sees the nginx container's bridge IP as the client
        # address for every request on Earth, and per-IP rate limiting silently becomes one global bucket
        # - the website's registration and sign-in limits would then apply to all visitors combined.
        # ForwardedHeadersOptions.ForwardedHeaders must also be set explicitly in the app: it defaults to
        # None, so UseForwardedHeaders() forwards nothing even when these headers are present.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        resolver 127.0.0.11 ipv6=off;

        location / {
           proxy_pass http://openmu-startup:8080;
        }
    }
}