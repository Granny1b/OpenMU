events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    resolver 127.0.0.11 ipv6=off;

    # Unknown hostname: drop the connection rather than serving either site under a name we do not
    # recognise. Needs the certificate too, because TLS is negotiated before the Host is known.
    server {
        listen 443 default_server ssl;
        listen [::]:443 default_server ssl;
        http2 on;

        include conf.d/nginx.prod.certificates.conf;
        server_tokens off;
        return 444;
    }

    # The public website, on the apex and www.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        include conf.d/nginx.site_server_name.conf;
        include conf.d/nginx.prod.certificates.conf;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # All six together - proxy_set_header does not merge across levels. Without X-Forwarded-For
        # every visitor looks like the nginx container and per-IP rate limiting is one global bucket.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must come before the catch-all. The health payload enumerates schema detail; it is also
        # bound to a container port that is never published, so this is the second control.
        location /healthz {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://mu-site:8080;
        }
    }

    # The OpenMU admin panel, on its own hostname. It occupies "/" and cannot be sub-pathed.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        include conf.d/nginx.admin_server_name.conf;
        include conf.d/nginx.prod.certificates.conf;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://openmu-startup:8080;
        }
    }
}
