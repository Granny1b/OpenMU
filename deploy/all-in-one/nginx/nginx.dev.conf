events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    resolver 127.0.0.11 ipv6=off;

    # The public website. Default server, so it answers whatever hostname you use -
    # http://localhost/ in the usual case.
    server {
        listen 80 default_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # proxy_set_header does NOT merge across levels: a block that defines any of these inherits
        # none of the outer ones, so all six live together here.
        #
        # Without X-Forwarded-For the application sees this container's bridge IP as the client
        # address for every request, and per-IP rate limiting becomes one global bucket.
        # ForwardedHeadersOptions.ForwardedHeaders must also be set explicitly in the app: it
        # defaults to None, so UseForwardedHeaders() forwards nothing even when these are present.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The site's health endpoint enumerates schema detail. It is bound to port 8081 inside the
        # container and never proxied, and this is the second, independent control. It must come
        # BEFORE the catch-all location.
        location /healthz {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://mu-site:8080;
        }
    }

    # The OpenMU admin panel. It occupies "/" and cannot be moved to a sub-path - UsePathBase
    # exists only in the Dapr hosts, not in src/Startup - so it gets its own hostname.
    # http://admin.localhost/ works in current browsers without touching /etc/hosts, because
    # *.localhost resolves to the loopback address.
    server {
        listen 80;
        server_name admin.localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://openmu-startup:8080;
        }
    }
}
