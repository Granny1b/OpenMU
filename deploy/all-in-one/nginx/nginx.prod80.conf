events {
}

http {
    # Anything asking for a hostname we do not serve gets nothing at all. This block is what makes
    # the $host redirect below safe: without it this server would be the default for port 80, would
    # answer any Host header, and would reflect that attacker-controlled value into a 301 Location.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_tokens off;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;

        # Both names, because certbot needs to answer the ACME challenge for each of them and the
        # redirect below has to be reachable for both.
        include conf.d/nginx.site_server_name.conf;
        include conf.d/nginx.admin_server_name.conf;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # $host, not $server_name. $server_name expands to the FIRST name in the directive, so
            # with more than one name a request to https://admin.example.org/x would be redirected
            # to https://example.org/x and the admin panel would be unreachable over plain HTTP.
            # Safe here only because the default_server block above rejects unknown hostnames.
            return 301 https://$host$request_uri;
        }
    }
}
